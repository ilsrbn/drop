name: Feature request
description: Suggest an addition to the Drop API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The page or component and the behavior you need.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed API or workaround you use today
